<!DOCTYPE html>
<html lang="zh-TW" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - 任務管理器與番茄鐘</title>
  
  <!-- CDN 資源庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b',
            },
            dark: {
              bg: '#0b0f17', card: '#151c28', hover: '#1e293b', border: '#2a364f',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- 正確指向 css/style.css -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col bg-dark-bg text-gray-100 antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white select-none">

  <!-- 頂部導覽列 Header -->
  <header class="border-b border-dark-border/80 bg-dark-bg/80 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-white via-indigo-100 to-indigo-400 bg-clip-text text-transparent">StudyFlow</h1>
          <p class="text-xs text-gray-400 -mt-1 hidden sm:block">學習生產力與專注中心</p>
        </div>
      </div>

      <!-- 分頁頁籤 -->
      <nav class="flex items-center space-x-1 sm:space-x-2 bg-dark-card p-1 rounded-xl border border-dark-border">
        <button id="tab-timer-btn" onclick="switchTab('timer')" class="nav-tab active px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center space-x-2 bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-stopwatch text-xs"></i><span>番茄鐘</span>
        </button>
        <button id="tab-tasks-btn" onclick="switchTab('tasks')" class="nav-tab px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-dark-hover transition-all duration-200 flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-xs"></i><span>任務清單</span>
          <span id="pending-count-badge" class="ml-1 px-1.5 py-0.5 text-[10px] bg-brand-500/20 text-brand-400 rounded-full font-semibold">0</span>
        </button>
        <button id="tab-analytics-btn" onclick="switchTab('analytics')" class="nav-tab px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-dark-hover transition-all duration-200 flex items-center space-x-2">
          <i class="fa-solid fa-chart-pie text-xs"></i><span>數據分析</span>
        </button>
      </nav>

      <!-- 右側工具欄 -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <button onclick="toggleAmbientMenu()" id="ambient-btn" class="p-2 rounded-xl bg-dark-card border border-dark-border text-gray-400 hover:text-white hover:border-brand-500/50 transition-all relative" title="背景環境音">
          <i class="fa-solid fa-headphones text-base"></i>
          <span id="ambient-indicator" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        </button>
        <button onclick="enterFocusOverlay()" class="px-3 py-2 rounded-xl bg-dark-card border border-dark-border text-gray-300 hover:text-brand-400 hover:border-brand-500/50 text-sm font-medium transition-all flex items-center space-x-1.5 shadow-sm" title="專注全螢幕">
          <i class="fa-solid fa-expand text-xs"></i><span class="hidden md:inline">專注模式</span>
        </button>
        <button onclick="requestNotificationPermission()" class="p-2 rounded-xl bg-dark-card border border-dark-border text-gray-400 hover:text-amber-400 transition-all" title="開啟桌面通知">
          <i class="fa-regular fa-bell"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 白噪音選單 Popover -->
  <div id="ambient-popover" class="hidden fixed top-16 right-4 sm:right-12 z-50 w-72 bg-dark-card border border-dark-border rounded-2xl shadow-2xl p-4 glass-effect">
    <div class="flex items-center justify-between mb-3 border-b border-dark-border pb-2">
      <h4 class="text-sm font-semibold flex items-center text-gray-200">
        <i class="fa-solid fa-sliders text-brand-400 mr-2"></i> 白噪音與環境音
      </h4>
      <button onclick="toggleAmbientMenu()" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs text-gray-300 flex items-center"><i class="fa-solid fa-cloud-showers-heavy text-blue-400 w-5"></i> 舒緩雨聲</span>
        <div class="flex items-center space-x-2">
          <input type="range" min="0" max="100" value="0" oninput="setAmbientVolume('rain', this.value)" class="w-24 accent-brand-500 h-1 bg-dark-hover rounded-lg cursor-pointer">
          <span id="rain-vol-val" class="text-[10px] text-gray-400 w-6 text-right">關閉</span>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-gray-300 flex items-center"><i class="fa-solid fa-wind text-gray-400 w-5"></i> 平衡白噪音</span>
        <div class="flex items-center space-x-2">
          <input type="range" min="0" max="100" value="0" oninput="setAmbientVolume('whitenoise', this.value)" class="w-24 accent-brand-500 h-1 bg-dark-hover rounded-lg cursor-pointer">
          <span id="whitenoise-vol-val" class="text-[10px] text-gray-400 w-6 text-right">關閉</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 主內容視窗 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 頁面 1: 番茄鐘計時器 -->
    <section id="view-timer" class="space-y-8 animate-fadeIn">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <div class="lg:col-span-7 bg-dark-card border border-dark-border rounded-3xl p-6 sm:p-10 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden">
          <div id="timer-glow" class="absolute w-72 h-72 rounded-full bg-brand-600/10 filter blur-3xl pointer-events-none transition-all duration-700"></div>

          <!-- 模式切換按鈕 -->
          <div class="flex bg-dark-bg p-1.5 rounded-2xl border border-dark-border mb-8 z-10">
            <button onclick="setTimerMode('focus')" id="mode-focus" class="timer-mode-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all bg-brand-600 text-white shadow">
              <i class="fa-solid fa-fire mr-1.5 text-rose-400"></i>專注 (25分)
            </button>
            <button onclick="setTimerMode('shortBreak')" id="mode-shortBreak" class="timer-mode-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-gray-400 hover:text-white transition-all">
              <i class="fa-solid fa-coffee mr-1.5 text-emerald-400"></i>短暫休息 (5分)
            </button>
            <button onclick="setTimerMode('longBreak')" id="mode-longBreak" class="timer-mode-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-gray-400 hover:text-white transition-all">
              <i class="fa-solid fa-couch mr-1.5 text-indigo-400"></i>長休息 (15分)
            </button>
          </div>

          <!-- 倒數圓環 -->
          <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center my-2 z-10">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" fill="none" class="text-dark-border" />
              <circle id="timer-progress-circle" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4.5" fill="none" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" class="text-brand-500 transition-all duration-1000 ease-linear" />
            </svg>
            <div class="absolute text-center flex flex-col items-center">
              <span id="timer-display" class="font-mono text-5xl sm:text-6xl font-bold tracking-tight text-white drop-shadow-md">25:00</span>
              <span id="timer-mode-label" class="text-xs uppercase tracking-widest text-brand-400 font-semibold mt-2">專注時間</span>
            </div>
          </div>

          <!-- 控制按鈕 -->
          <div class="flex items-center space-x-4 mt-8 z-10">
            <button id="timer-start-btn" onclick="toggleTimer()" class="w-36 py-3.5 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-semibold shadow-lg shadow-brand-500/25 hover:opacity-95 active:scale-95 transition-all text-base flex items-center justify-center space-x-2">
              <i id="timer-icon" class="fa-solid fa-play text-sm"></i>
              <span id="timer-btn-text">開始</span>
            </button>
            <button onclick="resetTimer()" class="p-3.5 rounded-2xl bg-dark-bg border border-dark-border text-gray-400 hover:text-white active:scale-95 transition-all" title="重置計時"><i class="fa-solid fa-rotate-left"></i></button>
            <button onclick="skipTimer()" class="p-3.5 rounded-2xl bg-dark-bg border border-dark-border text-gray-400 hover:text-white active:scale-95 transition-all" title="跳過階段"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <!-- 自訂時長 -->
          <div class="mt-8 pt-6 border-t border-dark-border/60 w-full flex items-center justify-between text-xs text-gray-400 z-10">
            <span>自訂時長 (分鐘):</span>
            <div class="flex items-center space-x-2">
              <input type="number" id="custom-focus" value="25" min="1" max="120" class="w-12 bg-dark-bg border border-dark-border rounded px-1.5 py-0.5 text-center text-white text-xs focus:border-brand-500 outline-none" onchange="updateCustomDurations()">
              <span>/</span>
              <input type="number" id="custom-short" value="5" min="1" max="60" class="w-12 bg-dark-bg border border-dark-border rounded px-1.5 py-0.5 text-center text-white text-xs focus:border-brand-500 outline-none" onchange="updateCustomDurations()">
              <span>/</span>
              <input type="number" id="custom-long" value="15" min="1" max="60" class="w-12 bg-dark-bg border border-dark-border rounded px-1.5 py-0.5 text-center text-white text-xs focus:border-brand-500 outline-none" onchange="updateCustomDurations()">
            </div>
          </div>
        </div>

        <div class="lg:col-span-5 space-y-6">
          <div class="bg-dark-card border border-dark-border rounded-3xl p-6 shadow-xl relative">
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs uppercase tracking-wider font-semibold text-brand-400 flex items-center">
                <i class="fa-solid fa-bullseye text-rose-500 mr-2"></i> 當前目標任務
              </span>
              <button onclick="switchTab('tasks')" class="text-xs text-gray-400 hover:text-brand-400 transition-all flex items-center">
                <span>選擇任務</span> <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
              </button>
            </div>
            <div id="active-task-container" class="p-4 rounded-2xl bg-dark-bg/60 border border-dark-border/80 min-h-[100px] flex flex-col justify-center">
              <div class="text-center text-gray-500 text-sm py-2"><p>尚未選擇進行中的任務。</p></div>
            </div>
            <div class="mt-4 flex items-center justify-between text-xs text-gray-400 bg-dark-bg px-3 py-2 rounded-xl">
              <span>目標任務完成進度:</span>
              <div id="target-pomodoro-counter" class="font-mono text-white flex items-center space-x-1">
                <span>0</span> / <span>0</span> <span class="text-rose-500 ml-1">🍅</span>
              </div>
            </div>
          </div>

          <div class="bg-dark-card border border-dark-border rounded-3xl p-6 shadow-xl grid grid-cols-2 gap-4">
            <div class="bg-dark-bg p-4 rounded-2xl border border-dark-border/60">
              <div class="text-gray-400 text-xs mb-1">今日專注時間</div>
              <div id="today-focus-hours" class="text-2xl font-bold font-mono text-emerald-400">0.0 <span class="text-xs font-sans text-gray-400">小時</span></div>
            </div>
            <div class="bg-dark-bg p-4 rounded-2xl border border-dark-border/60">
              <div class="text-gray-400 text-xs mb-1">完成番茄數</div>
              <div id="today-pomo-count" class="text-2xl font-bold font-mono text-rose-400">0 <span class="text-xs font-sans text-gray-400">🍅</span></div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- 頁面 2: 動態任務管理器 -->
    <section id="view-tasks" class="hidden space-y-6 animate-fadeIn">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-dark-card border border-dark-border rounded-2xl p-4 shadow-lg">
        <div class="flex flex-wrap items-center gap-2 sm:gap-3 flex-1">
          <!-- 搜尋關鍵字綁定 -->
          <div class="relative min-w-[200px] flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
            <input type="text" id="task-search-input" placeholder="搜尋任務..." oninput="renderTasks()" class="w-full bg-dark-bg border border-dark-border rounded-xl pl-9 pr-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
          </div>
          <!-- 分類過濾綁定 -->
          <select id="task-category-filter" onchange="renderTasks()" class="bg-dark-bg border border-dark-border rounded-xl px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-brand-500">
            <option value="all">所有分類</option>
            <option value="Study">📚 課業學習</option>
            <option value="Work">💼 工作專案</option>
            <option value="Life">🌿 個人生活</option>
          </select>
        </div>

        <div class="flex items-center space-x-3">
          <div class="bg-dark-bg p-1 rounded-xl border border-dark-border flex items-center">
            <button id="view-mode-list-btn" onclick="setTaskViewMode('list')" class="px-3 py-1 rounded-lg text-xs font-medium bg-brand-600 text-white shadow"><i class="fa-solid fa-list mr-1"></i> 清單</button>
            <button id="view-mode-kanban-btn" onclick="setTaskViewMode('kanban')" class="px-3 py-1 rounded-lg text-xs font-medium text-gray-400 hover:text-white"><i class="fa-solid fa-columns-stripe mr-1"></i> 看板</button>
          </div>
          <button onclick="openAddTaskModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-medium text-xs shadow-lg flex items-center space-x-1.5"><i class="fa-solid fa-plus text-xs"></i><span>新增任務</span></button>
        </div>
      </div>

      <div id="tasks-list-container" class="space-y-3"></div>

      <div id="tasks-kanban-container" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-dark-card border border-dark-border rounded-2xl p-4 flex flex-col min-h-[400px]">
          <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 mr-2"></span> 待辦事項</h3>
          <div id="kanban-col-todo" class="flex-1 space-y-3" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'todo')"></div>
        </div>
        <div class="bg-dark-card border border-dark-border rounded-2xl p-4 flex flex-col min-h-[400px]">
          <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-brand-400 mr-2"></span> 進行中</h3>
          <div id="kanban-col-in-progress" class="flex-1 space-y-3" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'in-progress')"></div>
        </div>
        <div class="bg-dark-card border border-dark-border rounded-2xl p-4 flex flex-col min-h-[400px]">
          <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 mr-2"></span> 已完成</h3>
          <div id="kanban-col-done" class="flex-1 space-y-3" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'done')"></div>
        </div>
      </div>
    </section>

    <!-- 頁面 3: 數據分析儀表板 -->
    <section id="view-analytics" class="hidden space-y-8 animate-fadeIn">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6">
        <div class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-lg">
          <div class="text-gray-400 text-xs mb-2">累積專注時間</div>
          <div id="stats-total-hours" class="text-2xl sm:text-3xl font-bold font-mono text-white">0.0 <span class="text-xs font-sans text-gray-400">小時</span></div>
        </div>
        <div class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-lg">
          <div class="text-gray-400 text-xs mb-2">已完成任務</div>
          <div id="stats-completed-tasks" class="text-2xl sm:text-3xl font-bold font-mono text-emerald-400">0</div>
        </div>
        <div class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-lg">
          <div class="text-gray-400 text-xs mb-2">收穫番茄總數</div>
          <div id="stats-total-pomo" class="text-2xl sm:text-3xl font-bold font-mono text-rose-400">0 🍅</div>
        </div>
        <div class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-lg">
          <div class="text-gray-400 text-xs mb-2">連續專注天數</div>
          <div id="stats-streak" class="text-2xl sm:text-3xl font-bold font-mono text-amber-400">1 <span class="text-xs font-sans text-gray-400">天</span></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-8 bg-dark-card border border-dark-border rounded-3xl p-6 shadow-xl">
          <h3 class="text-sm font-bold text-gray-200 mb-4 flex items-center"><i class="fa-solid fa-chart-column text-brand-400 mr-2"></i> 本週專注時間統計 (小時)</h3>
          <div class="h-64 relative"><canvas id="weekly-chart"></canvas></div>
        </div>
        <div class="lg:col-span-4 bg-dark-card border border-dark-border rounded-3xl p-6 shadow-xl">
          <h3 class="text-sm font-bold text-gray-200 mb-4 flex items-center"><i class="fa-solid fa-chart-pie text-purple-400 mr-2"></i> 任務類別分布</h3>
          <div class="h-56 relative"><canvas id="category-chart"></canvas></div>
        </div>
      </div>

      <div class="bg-dark-card border border-dark-border rounded-3xl p-6 shadow-xl space-y-3">
        <h3 class="text-sm font-bold text-gray-200 flex items-center"><i class="fa-solid fa-calendar-days text-emerald-400 mr-2"></i> 專注活動紀錄熱力圖 (最近 30 天)</h3>
        <div id="heatmap-grid" class="flex flex-wrap gap-2 pt-2"></div>
      </div>
    </section>

  </main>

  <!-- 全螢幕沉浸 Overlay -->
  <div id="focus-overlay" class="hidden fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-between p-8 sm:p-12 transition-all">
    <div class="w-full max-w-4xl flex items-center justify-between">
      <span class="text-brand-400 font-bold text-lg"><i class="fa-solid fa-graduation-cap mr-2"></i>StudyFlow 沉浸專注</span>
      <button onclick="exitFocusOverlay()" class="px-4 py-2 rounded-xl bg-dark-card border border-dark-border text-gray-300 hover:text-white text-xs font-semibold">退出專注模式</button>
    </div>
    <div class="flex flex-col items-center justify-center my-auto text-center">
      <div id="overlay-task-title" class="px-4 py-1.5 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-300 text-sm mb-6">尚未選擇進行中的任務</div>
      <div id="overlay-timer-display" class="font-mono text-7xl sm:text-9xl font-extrabold text-white tracking-tight">25:00</div>
      <div class="flex items-center space-x-6 pt-8">
        <button onclick="toggleTimer()" class="w-40 py-4 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold text-lg shadow-xl flex items-center justify-center space-x-2"><i class="fa-solid fa-play"></i><span>開始/暫停</span></button>
        <button onclick="resetTimer()" class="p-4 rounded-2xl bg-dark-card border border-dark-border text-gray-400 hover:text-white text-lg"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
  </div>

  <!-- 新增/編輯任務 Modal -->
  <div id="task-modal" class="hidden fixed inset-0 z-50 glass-effect flex items-center justify-center p-4">
    <div class="bg-dark-card border border-dark-border rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-dark-border pb-3">
        <h3 id="modal-title" class="text-base font-bold text-white">新增任務</h3>
        <button onclick="closeTaskModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="task-form" onsubmit="saveTask(event)" class="space-y-4">
        <input type="hidden" id="task-id">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">任務名稱 *</label>
          <input type="text" id="form-task-title" required placeholder="例如：讀完離散數學第三章" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">分類</label>
            <select id="form-task-category" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-gray-200">
              <option value="Study">📚 課業學習</option>
              <option value="Work">💼 工作專案</option>
              <option value="Life">🌿 個人生活</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">預估番茄鐘 🍅</label>
            <input type="number" id="form-task-est-pomo" min="1" value="2" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-white">
          </div>
        </div>
        <div class="flex items-center justify-end space-x-3 pt-3 border-t border-dark-border">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2 rounded-xl bg-dark-bg text-gray-400 text-xs">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-medium text-xs shadow-lg">儲存任務</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 正確指向 js/app.js -->
  <script src="js/app.js"></script>
</body>
</html>
